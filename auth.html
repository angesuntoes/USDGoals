<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing in…</title>
<style>
  html,body{height:100%;margin:0;display:flex;align-items:center;justify-content:center;
            background:#f5f5f5;font-family:"72","72full",Arial,Helvetica,sans-serif;
            font-size:14px;color:#32363a}
  .msg{text-align:center;line-height:1.6}
  .spinner{width:24px;height:24px;border:3px solid #e0e0e0;border-top-color:#0070F2;
           border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
(function () {
  // Relay the raw hash/query to the parent window so MSAL's monitorPopupForHash
  // message listener can resolve the loginPopup promise.
  //
  // CRITICAL: do NOT call window.close() immediately.
  // MSAL's polling runs every 30 ms. If the popup closes before the message
  // event is processed, the interval fires first, sees popup.closed=true, and
  // throws "user_cancelled" — even though the message was already queued.
  //
  // Instead: post the hash, then wait. The parent's MSAL will call popup.close()
  // once it has resolved the token. Only force-close after a long timeout as a
  // last resort (e.g. if the parent has no cross-origin message listener).

  var payload = window.location.hash || window.location.search || '';

  if (payload && window.opener && !window.opener.closed) {
    try { window.opener.postMessage(payload, '*'); } catch (e) {}
  }

  // Fallback: close ourselves after 10 s if the parent did not close us first.
  // Under normal operation this timeout never fires — the parent closes the popup
  // within ~1 s after receiving and processing the hash.
  setTimeout(function () { window.close(); }, 10000);
}());
</script>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    Completing sign&#8209;in&hellip;
  </div>
</body>
</html>
