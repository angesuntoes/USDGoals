<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing in…</title>
<style>
  html,body{height:100%;margin:0;display:flex;align-items:center;justify-content:center;
            background:#f5f5f5;font-family:"72","72full",Arial,sans-serif;color:#32363a}
  .msg{font-size:14px;opacity:.7}
</style>
<!-- MSAL 2.39.0 — same version as the dashboard -->
<script src="https://alcdn.msauth.net/browser/2.39.0/js/msal-browser.min.js"
        integrity="sha384-4wY3kFJSEbBVCHf/nHxaHswRjIxGhKKCTd4iFGqvpC6R8dFW+cq0qBXV3j7VR+c"
        crossorigin="anonymous"></script>
<script>
(async function () {
  /* ── This page exists solely as the MSAL redirectUri relay. ──────────────
     When a loginPopup flow completes, Microsoft redirects the popup to this
     page with #code=... in the hash. We initialise a matching MSAL instance,
     call handleRedirectPromise() so MSAL can exchange the code and communicate
     the token back to the opener window (via BroadcastChannel / postMessage),
     then immediately close the popup. The user never interacts with this page.
  ─────────────────────────────────────────────────────────────────────────── */
  try {
    var app = new msal.PublicClientApplication({
      auth: {
        clientId             : '308537bd-a7c1-42de-a4bc-3cc0fa6e229c',
        authority            : 'https://login.microsoftonline.com/42f7676c-f455-423c-82f6-dc2d99791af7',
        redirectUri          : 'https://angesuntoes.github.io/USDGoals/auth.html',
        navigateToLoginRequestUrl: false
      },
      cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false }
    });
    if (typeof app.initialize === 'function') await app.initialize();
    await app.handleRedirectPromise();
  } catch (e) {
    console.warn('[auth relay] handleRedirectPromise error:', e);
  }
  window.close();
}());
</script>
</head>
<body>
  <p class="msg">Completing sign-in&hellip;</p>
</body>
</html>
